<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Complaints</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2>Complaint Records</h2>

    <table class="table table-bordered">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Complaint</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="complaint : ${complaints}">

                <td th:text="${complaint.id}"></td>

                <td th:text="${complaint.studentName}"></td>

                <td th:text="${complaint.complaintText}"></td>

                <td>

                    <span th:if="${complaint.status=='PENDING'}"
                          class="badge bg-danger">
                        PENDING
                    </span>

                    <span th:if="${complaint.status=='RESOLVED'}"
                          class="badge bg-success">
                        RESOLVED
                    </span>

                </td>

                <td>

                    <a th:href="@{/complaints/resolve/{id}(id=${complaint.id})}"
                       class="btn btn-success btn-sm">
                        Resolve
                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>
</html>
