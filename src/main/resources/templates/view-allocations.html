<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Allocated Rooms</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Allocated Rooms</h2>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Room</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="allocation : ${allocations}">
            <td th:text="${allocation.allocationId}"></td>


                <td th:text="${allocation.student.name}"></td>

                <td th:text="${allocation.room.roomNumber}"></td>

                <td>
                    <a th:href="@{/allocations/delete/{id}(id=${allocation.allocationId})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Vacate this room?')">
                        Vacate
                    </a>
                </td>

            </tr>

        </tbody>

    </table>

    <a href="/" class="btn btn-secondary">
        Back to Dashboard
    </a>

</div>

</body>
</html>
