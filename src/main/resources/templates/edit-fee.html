<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Fee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2>Edit Fee Record</h2>

    <form th:action="@{/fees/update}" method="post">

        <input type="hidden"
               name="id"
               th:value="${fee.id}">

        <div class="mb-3">
            <label>Student Name</label>
            <input type="text"
                   name="studentName"
                   class="form-control"
                   th:value="${fee.studentName}">
        </div>

        <div class="mb-3">
            <label>Amount</label>
            <input type="number"
                   name="amount"
                   class="form-control"
                   th:value="${fee.amount}">
        </div>

        <div class="mb-3">
            <label>Status</label>

            <select name="status" class="form-control">

                <option value="PAID"
                    th:selected="${fee.status=='PAID'}">
                    PAID
                </option>

                <option value="UNPAID"
                    th:selected="${fee.status=='UNPAID'}">
                    UNPAID
                </option>

            </select>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Update Fee
        </button>

        <a href="/fees/view"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
